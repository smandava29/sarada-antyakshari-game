name: Verify and deploy to Cloudflare

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  verify:
    name: Security and build checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Generate validation Wrangler configuration
        run: node scripts/generate-wrangler-config.js --validation-only

      - name: Scan repository files for secrets
        run: npm run security:scan

      - name: Install locked dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_ADSENSE_ENABLED: ${{ vars.VITE_ADSENSE_ENABLED }}
          VITE_ADSENSE_PRIVACY_REVIEWED: ${{ vars.VITE_ADSENSE_PRIVACY_REVIEWED }}
          VITE_ADSENSE_CLIENT: ${{ vars.VITE_ADSENSE_CLIENT }}
          VITE_ADSENSE_LEFT_SLOT: ${{ vars.VITE_ADSENSE_LEFT_SLOT }}
          VITE_ADSENSE_RIGHT_SLOT: ${{ vars.VITE_ADSENSE_RIGHT_SLOT }}
          VITE_ADSENSE_BOTTOM_SLOT: ${{ vars.VITE_ADSENSE_BOTTOM_SLOT }}

  deploy:
    name: Deploy production Worker
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Generate production Wrangler configuration
        run: node scripts/generate-wrangler-config.js
        env:
          CLOUDFLARE_PROD_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_PROD_D1_DATABASE_ID }}
          CLOUDFLARE_PROD_R2_BUCKET_NAME: ${{ vars.CLOUDFLARE_PROD_R2_BUCKET_NAME }}

      - name: Build production bundle
        run: npm run build:production
        env:
          VITE_ADSENSE_ENABLED: ${{ vars.VITE_ADSENSE_ENABLED }}
          VITE_ADSENSE_PRIVACY_REVIEWED: ${{ vars.VITE_ADSENSE_PRIVACY_REVIEWED }}
          VITE_ADSENSE_CLIENT: ${{ vars.VITE_ADSENSE_CLIENT }}
          VITE_ADSENSE_LEFT_SLOT: ${{ vars.VITE_ADSENSE_LEFT_SLOT }}
          VITE_ADSENSE_RIGHT_SLOT: ${{ vars.VITE_ADSENSE_RIGHT_SLOT }}
          VITE_ADSENSE_BOTTOM_SLOT: ${{ vars.VITE_ADSENSE_BOTTOM_SLOT }}

      - name: Apply production D1 migrations
        run: npx wrangler d1 migrations apply DB --remote --env production --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy with Wrangler
        run: npx wrangler deploy --env production --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
